[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ion-td"
version = "0.1.0"
description = "可复现的五唑离子盐热分解温度实验性评估工作流"
keywords = ["energetic-materials", "thermal-decomposition", "pentazolate", "rdkit", "scikit-learn", "xtb", "cheminformatics", "uncertainty-quantification", "HEMERA"]
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
authors = [{name = "HEMERA BPPA"}]
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.6,<1.9",
  "rdkit>=2024.3",
  "PyYAML>=6",
]

[project.urls]
Homepage = "https://github.com/Bagabaga007/ion_Td"
Repository = "https://github.com/Bagabaga007/ion_Td"
Documentation = "https://github.com/Bagabaga007/ion_Td/blob/main/docs/usage.md"

[project.optional-dependencies]
geometry = ["dscribe>=2.1"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "coverage>=7",
  "ruff>=0.8",
  "build>=1.2",
  "dscribe>=2.1",
]

[project.scripts]
ion-td = "ion_td.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ion_td = ["data/*.csv", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "unit: isolated chemistry, feature, model, and data tests",
  "integration: multi-component local workflow tests",
  "config: package/configuration/provenance contract tests",
  "system: CLI and executable-stub end-to-end tests",
]

[tool.coverage.run]
branch = true
source = ["ion_td"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py310"
